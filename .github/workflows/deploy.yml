name: Deploy demo to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: modal/package-lock.json
      - name: Install the dependencies (the lock file of the repository is not in sync with package.json)
        run: npm install --no-audit --no-fund
      - name: Use the demo page (source files in the repository stay untouched)
        run: |
          cp ../demo/index.js src/index.js
          cp ../demo/App.js src/App.js
          cp ../demo/App.css src/App.css
      - name: Build the demo site
        run: npx react-scripts build
        env:
          CI: false
          PUBLIC_URL: /reactjs-modal-clarabernadou
      - uses: actions/upload-pages-artifact@v3
        with:
          path: modal/build
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
